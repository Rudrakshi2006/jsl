<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Palindrome Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5ff;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        h2 {
            text-align: center;
            color: #234b75;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #b8c9dc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #3478b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #285f94;
        }

        #result {
            background: #f3f8ff;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Palindrome Checker</h2>

    <label for="word">Enter a Word:</label>
    <input type="text" id="word" placeholder="Enter word">

    <button onclick="checkPalindrome()">Check Palindrome</button>

    <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>

























<!--
JavaScript functions are used to perform specific tasks and reuse code. In this practical, a word is reversed and compared with the original word to check whether it is a palindrome. Closures and exception handling are also used to demonstrate function scope and error handling.

- function: Defines a reusable block of code.
- split(""): Converts a string into an array of characters.
- reverse(): Reverses the elements of an array.
- join(""): Combines array elements into a string.
- toLowerCase(): Converts text into lowercase.
- length: Returns the number of characters.
- Closure: Allows an inner function to access variables of its outer function.
- try: Contains code that may generate an error.
- throw: Generates a custom error.
- catch: Handles errors.
- alert(): Displays validation error messages.
- innerHTML: Displays the palindrome result.
-->
