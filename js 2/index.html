<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billing Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5ff;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        h2 {
            text-align: center;
            color: #234b75;
        }

        h3 {
            color: #234b75;
            margin-top: 20px;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #b8c9dc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #3478b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #285f94;
        }

        #result {
            background: #f3f8ff;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Billing Calculator</h2>

    <label for="product">Product Name:</label>
    <input type="text" id="product" placeholder="Enter product name">

    <label for="price">Product Price:</label>
    <input type="number" id="price" placeholder="Enter price">

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" placeholder="Enter quantity">

    <button onclick="calculateBill()">Calculate Bill</button>

    <h3>Bill Details</h3>
    <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
