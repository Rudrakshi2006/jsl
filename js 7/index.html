<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background: #eef5ff;
            padding: 30px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #d1dbe8;
        }

        h2 {
            text-align: center;
            color: #234b75;
        }

        h3 {
            color: #234b75;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 75%;
            padding: 10px;
            border: 1px solid #b8c9dc;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #3478b9;
            color: white;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f3f8ff;
            padding: 12px;
            margin-top: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        li span {
            overflow-wrap: anywhere;
        }

        .buttons {
            display: flex;
            gap: 5px;
        }

        .edit {
            background: #e5a04b;
        }

        .delete {
            background: #d96565;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>My To-Do List</h2>

        <label>Enter Your Task:</label>

        <input type="text" id="taskInput"
               placeholder="Enter a task">

        <button id="addBtn">Add</button>

        <h3>Today's Tasks</h3>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>

























<!--
The Document Object Model (DOM) represents HTML elements as objects that can be accessed and modified using JavaScript. In this practical, users can add, edit and delete tasks dynamically. JavaScript DOM methods and event listeners are used to update the webpage without reloading it.

- DOM: Represents the structure of an HTML document.
- getElementById(): Selects HTML elements by ID.
- addEventListener(): Executes a function when an event occurs.
- createElement(): Creates a new HTML element.
- textContent: Sets or updates text inside an element.
- className: Assigns a CSS class to an element.
- appendChild(): Adds a child element to a parent element.
- removeChild(): Removes a child element.
- prompt(): Takes input from the user through a popup.
- trim(): Removes unnecessary spaces.
-->
