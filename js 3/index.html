<!DOCTYPE html>
<html>
<head>
    <title>Student Grading System</title>

    <style>
        body {
            font-family: Arial;
            background: #eef5ff;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #234b75;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #b8c9dc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #3478b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            background: #f3f8ff;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Grading System</h2>

    <label>Student Name:</label>
    <input type="text" id="name" placeholder="Enter student name">

    <label>Enter Marks (0-100):</label>
    <input type="number" id="marks" placeholder="Enter marks">

    <button onclick="calculateGrade()">Calculate Grade</button>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>

























<!--
Control structures are used to make decisions based on different conditions. In this practical, the user enters student details and marks, and JavaScript calculates the grade using conditional statements. Input validation is performed to prevent invalid marks.

- getElementById(): Reads student details from input fields.
- Number(): Converts marks into a numeric value.
- if...else if...else: Checks marks and assigns grades.
- Comparison Operators: Compare marks with grade limits.
- Logical Operators: Combine multiple validation conditions.
- isNaN(): Checks whether a value is Not a Number.
- return: Stops function execution when input is invalid.
- innerHTML: Displays student details and grade.
-->
