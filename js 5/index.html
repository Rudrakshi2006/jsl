<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart Calculator</title>
    <style>
        body {
            font-family: Arial;
            background: #eef5ff;
            padding: 25px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #d1dbe8;
        }
        h2 {
            text-align: center;
            color: #234b75;
        }
        h3 {
            color: #234b75;
        }
        .fields {
            display: flex;
            gap: 15px;
        }
        .field {
            flex: 1;
            min-width: 0;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #b8c9dc;
            border-radius: 5px;
        }
        button {
            background: #3478b9;
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 5px;
            margin-top: 18px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #3478b9;
            color: white;
        }
        th, td {
            border: 1px solid #d5e0eb;
            padding: 11px;
            text-align: center;
        }
        .result {
            background: #f3f8ff;
            padding: 18px;
            margin-top: 20px;
            border-radius: 8px;
            line-height: 1.9;
        }
        .total {
            color: #176b49;
            font-size: 20px;
        }
        .lists {
            display: flex;
            gap: 25px;
        }
        .lists > div {
            flex: 1;
        }
        @media (max-width: 600px) {
            .fields, .lists {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Shopping Cart Calculator</h2>

    <div class="fields">
        <div class="field">
            <label>Product Name</label>
            <input type="text" id="name" placeholder="Enter product">
        </div>

        <div class="field">
            <label>Price (Rs.)</label>
            <input type="number" id="price" placeholder="Enter price">
        </div>

        <div class="field">
            <label>Quantity</label>
            <input type="number" id="qty" placeholder="Enter quantity">
        </div>
    </div>

    <button onclick="addProduct()">Add Product</button>

    <h3>Shopping Cart</h3>

    <table id="cartTable">
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>
    </table>

    <div class="result" id="result">
        <h3>Bill Summary</h3>
        Add products to calculate your bill.
    </div>

    <div class="lists">
        <div>
            <h3>Item Summary</h3>
            <ul id="summary"></ul>
        </div>

        <div>
            <h3>Expensive Products (Price > 1000)</h3>
            <ul id="expensive"></ul>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>

























<!--
Arrays and objects are used to store and manage multiple product details in JavaScript. In this practical, products are added to a shopping cart, and their total price is calculated using array methods. Discounts are applied according to the total amount, and the final bill is displayed.

- Array: Stores multiple products in a single variable.
- Object: Stores product details such as name, price and quantity.
- push(): Adds a new product to the array.
- forEach(): Iterates through products to display them.
- reduce(): Calculates the total price of all products.
- map(): Processes each product and normally returns a new array.
- filter(): Selects products that satisfy a condition.
- length: Returns the number of products.
- toFixed(2): Displays amounts with two decimal places.
- innerHTML: Displays product details and the final bill.
-->
