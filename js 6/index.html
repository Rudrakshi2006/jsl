<!--
JavaScript provides different string methods to process and manipulate text. Regular expressions are used to search, match and validate text patterns. In this practical, the program performs word splitting, vowel counting, text replacement, email validation and email extraction.

- split(): Divides a string into an array.
- match(): Finds text matching a regular expression.
- replace(): Replaces matching text with another value.
- indexOf(): Returns the position of a word or character.
- test(): Checks whether a string matches a regular expression.
- join(): Combines array elements into a string.
- reverse(): Reverses array elements.
- trim(): Removes extra spaces from the beginning and end.
- Regular Expression (Regex): Defines a pattern for searching and validation.
- g Flag: Searches for all matches.
- i Flag: Performs case-insensitive matching.
-->
