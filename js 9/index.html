<!DOCTYPE html>
<html>
<head>
    <title>Theme Preferences</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eef5ff;
            color: #234b75;
            padding: 40px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 12px 18px;
            margin: 8px;
            border: none;
            border-radius: 5px;
            background: #3478b9;
            color: white;
            cursor: pointer;
        }

        body.dark {
            background: #252a38;
            color: white;
        }

        body.dark .container {
            background: #353c4e;
        }

        body.dark button {
            background: #6577b8;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Theme Preferences</h2>

    <p>Save your theme using localStorage and sessionStorage.</p>

    <button onclick="setTheme('light')">Light Theme</button>
    <button onclick="setTheme('dark')">Dark Theme</button>
    <button onclick="clearPreference()">Clear Preference</button>

</div>

<script src="script.js"></script>

</body>
</html>

























<!--
Web Storage allows websites to store data in the user's browser. In this practical, JavaScript is used to switch between light and dark themes and save the selected preference. The stored theme can be retrieved when the webpage is loaded again.

- localStorage: Stores data that remains available after closing the browser.
- sessionStorage: Stores data for the current tab session.
- setItem(): Saves a key-value pair in browser storage.
- getItem(): Retrieves a saved value.
- removeItem(): Deletes a saved value.
- document.body: Accesses the body element of the webpage.
- className: Changes the CSS class of an element.
- window.onload: Executes a function when the webpage finishes loading.
-->
