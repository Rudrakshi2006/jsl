<!DOCTYPE html>
<html>
<head>
    <title>Gym Admission Form</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf4f5;
            padding: 30px;
        }

        .container {
            max-width: 420px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #cbdede;
        }

        h2 {
            text-align: center;
            color: #286b73;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #b5cccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .error {
            color: red;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #388c92;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            color: green;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Gym Admission Form</h2>

    <form id="gymForm">

        <label>Full Name:</label>
        <input type="text" id="name">
        <span id="nameError" class="error"></span>

        <label>Age:</label>
        <input type="number" id="age">
        <span id="ageError" class="error"></span>

        <label>Email:</label>
        <input type="text" id="email">
        <span id="emailError" class="error"></span>

        <label>Mobile Number:</label>
        <input type="text" id="mobile">
        <span id="mobileError" class="error"></span>

        <label>Membership Plan:</label>
        <select id="plan">
            <option value="">Select Plan</option>
            <option>Monthly</option>
            <option>Quarterly</option>
            <option>Yearly</option>
        </select>
        <span id="planError" class="error"></span>

        <button type="submit">Submit</button>

        <p id="result"></p>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>

























<!--
JavaScript event handling is used to perform actions when users interact with a webpage. In this practical, a gym admission form validates user details such as name, age, email, mobile number and membership plan. Different events are used to provide validation messages and prevent incorrect form submission.

- addEventListener(): Attaches an event handler to an element.
- input Event: Occurs when the user changes an input field by typing.
- blur Event: Occurs when an input field loses focus.
- change Event: Occurs when a field's value is changed and committed.
- submit Event: Occurs when the form is submitted.
- this.value: Gets the value of the current input field in a regular event handler.
- test(): Validates input using a regular expression.
- preventDefault(): Prevents the default form submission action.
- innerText: Displays validation error messages.
- trim(): Removes unnecessary spaces from input.
-->
